<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Souq AI - Chat Test</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-size: 1.25rem; }
  .hidden { display: none !important; }

  #gate {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    max-width: 320px;
    margin: 3rem auto;
  }
  #gate p { margin: 0 0 0.25rem; opacity: 0.8; }
  #gate input {
    padding: 0.6rem;
    border-radius: 6px;
    border: 1px solid #8884;
    font-size: 1rem;
  }
  #gate button {
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 1rem;
  }
  #gate .gate-error { color: #dc2626; font-size: 0.85rem; min-height: 1rem; }

  #messages {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 1rem;
    height: 60vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .msg { max-width: 80%; padding: 0.5rem 0.75rem; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: white; }
  .bot { align-self: flex-start; background: #8882; }
  .error { align-self: flex-start; background: #dc2626; color: white; }
  .category {
    display: block;
    font-size: 0.7rem;
    opacity: 0.7;
    margin-bottom: 0.15rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #composer { display: flex; gap: 0.5rem; margin-top: 1rem; }
  #input { flex: 1; padding: 0.6rem; border-radius: 6px; border: 1px solid #8884; font-size: 1rem; }
  #send { padding: 0.6rem 1.2rem; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; }
  #send:disabled { opacity: 0.5; cursor: default; }

  #location-status {
    font-size: 0.8rem;
    opacity: 0.65;
    margin-top: 0.5rem;
  }
  #location-status button {
    background: none;
    border: none;
    color: #2563eb;
    cursor: pointer;
    font-size: 0.8rem;
    padding: 0;
    text-decoration: underline;
  }

  #location-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #location-modal {
    background: Canvas;
    color: CanvasText;
    border-radius: 10px;
    padding: 1.5rem;
    max-width: 320px;
    width: 90%;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  #location-modal h2 { font-size: 1.05rem; margin: 0; }
  #location-modal p { margin: 0; opacity: 0.8; font-size: 0.9rem; }
  #location-modal button.primary {
    padding: 0.6rem 1rem;
    border-radius: 6px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 0.95rem;
  }
  #location-modal .divider {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    opacity: 0.6;
    font-size: 0.8rem;
  }
  #location-modal .divider hr { flex: 1; border: none; border-top: 1px solid #8884; }
  #location-modal .coords-row { display: flex; gap: 0.5rem; }
  #location-modal .coords-row input {
    width: 0;
    flex: 1;
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid #8884;
    font-size: 0.9rem;
  }
  #location-modal .modal-error { color: #dc2626; font-size: 0.85rem; min-height: 1rem; }
  .typing { display: flex; gap: 0.25rem; align-items: center; padding: 0.65rem 0.75rem; }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.4;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>
<h1>Souq AI - Chat Test</h1>

<div id="gate">
  <p>Enter your phone number to start chatting with Souq AI.</p>
  <input id="phone-input" type="tel" placeholder="e.g. +966 5xxxxxxxx" autofocus />
  <button id="gate-submit">Start Chat</button>
  <div class="gate-error" id="gate-error"></div>
</div>

<div id="app" class="hidden">
  <div id="messages"></div>
  <div id="composer">
    <input id="input" type="text" placeholder="Ask about deals, prices, or Souq AI..." />
    <button id="send">Send</button>
  </div>
  <div id="location-status"></div>
</div>

<div id="location-overlay" class="hidden">
  <div id="location-modal">
    <h2>Share your location</h2>
    <p>Souq AI needs your location to find the nearest stores and deals.</p>
    <button id="use-current-location" class="primary">Use my current location</button>
    <div class="divider"><hr />or enter coordinates<hr /></div>
    <div class="coords-row">
      <input id="lat-input" type="number" step="any" placeholder="Latitude" />
      <input id="lng-input" type="number" step="any" placeholder="Longitude" />
    </div>
    <button id="submit-coords" class="primary">Submit</button>
    <div class="modal-error" id="location-error"></div>
  </div>
</div>

<script>
  const PHONE_STORAGE_KEY = "souq_ai_phone_number";
  const LAT_STORAGE_KEY = "souq_ai_latitude";
  const LNG_STORAGE_KEY = "souq_ai_longitude";

  const gateEl = document.getElementById("gate");
  const phoneInputEl = document.getElementById("phone-input");
  const gateSubmitEl = document.getElementById("gate-submit");
  const gateErrorEl = document.getElementById("gate-error");

  const appEl = document.getElementById("app");
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const locationStatusEl = document.getElementById("location-status");

  const locationOverlayEl = document.getElementById("location-overlay");
  const useCurrentLocationEl = document.getElementById("use-current-location");
  const latInputEl = document.getElementById("lat-input");
  const lngInputEl = document.getElementById("lng-input");
  const submitCoordsEl = document.getElementById("submit-coords");
  const locationErrorEl = document.getElementById("location-error");

  let phoneNumber = null;
  let coords = null;
  let pendingRetryMessage = null;

  function loadStoredCoords() {
    const lat = localStorage.getItem(LAT_STORAGE_KEY);
    const lng = localStorage.getItem(LNG_STORAGE_KEY);
    if (lat !== null && lng !== null) {
      coords = { latitude: parseFloat(lat), longitude: parseFloat(lng) };
    }
    renderLocationStatus();
  }

  function saveCoords(latitude, longitude) {
    coords = { latitude, longitude };
    localStorage.setItem(LAT_STORAGE_KEY, String(latitude));
    localStorage.setItem(LNG_STORAGE_KEY, String(longitude));
    renderLocationStatus();
  }

  function renderLocationStatus() {
    locationStatusEl.innerHTML = "";
    if (coords) {
      locationStatusEl.append(
        `Location: ${coords.latitude.toFixed(4)}, ${coords.longitude.toFixed(4)} `
      );
    } else {
      locationStatusEl.append("Location: not shared ");
    }
    const link = document.createElement("button");
    link.textContent = coords ? "change" : "set";
    link.addEventListener("click", () => {
      pendingRetryMessage = null;
      openLocationModal();
    });
    locationStatusEl.appendChild(link);
  }

  function openLocationModal() {
    locationErrorEl.textContent = "";
    latInputEl.value = coords ? coords.latitude : "";
    lngInputEl.value = coords ? coords.longitude : "";
    locationOverlayEl.classList.remove("hidden");
  }

  function closeLocationModal() {
    locationOverlayEl.classList.add("hidden");
  }

  function onLocationProvided(latitude, longitude) {
    saveCoords(latitude, longitude);
    closeLocationModal();
    if (pendingRetryMessage) {
      const message = pendingRetryMessage;
      pendingRetryMessage = null;
      sendMessage({ text: message, silent: true });
    }
  }

  useCurrentLocationEl.addEventListener("click", () => {
    if (!navigator.geolocation) {
      locationErrorEl.textContent = "Geolocation isn't available in this browser - enter coordinates manually.";
      return;
    }
    locationErrorEl.textContent = "Requesting location...";
    navigator.geolocation.getCurrentPosition(
      (position) => onLocationProvided(position.coords.latitude, position.coords.longitude),
      () => {
        locationErrorEl.textContent = "Couldn't get your location - enter coordinates manually below.";
      }
    );
  });

  submitCoordsEl.addEventListener("click", () => {
    const latitude = parseFloat(latInputEl.value);
    const longitude = parseFloat(lngInputEl.value);
    if (Number.isNaN(latitude) || Number.isNaN(longitude)) {
      locationErrorEl.textContent = "Please enter valid latitude and longitude values.";
      return;
    }
    onLocationProvided(latitude, longitude);
  });

  function addMessage(text, cls, category) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + cls;
    if (category) {
      const badge = document.createElement("span");
      badge.className = "category";
      badge.textContent = category;
      wrap.appendChild(badge);
    }
    wrap.appendChild(document.createTextNode(text));
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addTypingIndicator() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot typing";
    wrap.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  async function loadHistory() {
    try {
      const res = await fetch(`/chat/history?phone_number=${encodeURIComponent(phoneNumber)}`);
      if (!res.ok) return;
      const history = await res.json();
      for (const msg of history) {
        addMessage(msg.content, msg.role === "user" ? "user" : "bot");
      }
    } catch (err) {
      // Non-fatal - just start with an empty visible history.
    }
  }

  async function enterChat(number) {
    phoneNumber = number;
    localStorage.setItem(PHONE_STORAGE_KEY, phoneNumber);
    loadStoredCoords();
    gateEl.classList.add("hidden");
    appEl.classList.remove("hidden");
    await loadHistory();
    inputEl.focus();
  }

  gateSubmitEl.addEventListener("click", () => {
    const number = phoneInputEl.value.trim();
    if (!number) {
      gateErrorEl.textContent = "Please enter a phone number.";
      return;
    }
    gateErrorEl.textContent = "";
    enterChat(number);
  });
  phoneInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") gateSubmitEl.click();
  });

  async function sendMessage(options) {
    const opts = options || {};
    const text = opts.silent ? opts.text : inputEl.value.trim();
    if (!text) return;

    if (!opts.silent) {
      addMessage(text, "user");
      inputEl.value = "";
    }
    sendEl.disabled = true;
    const typingEl = addTypingIndicator();

    try {
      const body = { message: text, phone_number: phoneNumber };
      if (coords) {
        body.latitude = coords.latitude;
        body.longitude = coords.longitude;
      }
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      typingEl.remove();
      if (!res.ok) {
        addMessage(`Request failed (${res.status})`, "error");
        return;
      }
      const data = await res.json();
      addMessage(data.reply, "bot", data.category);
      if (data.needs_location) {
        pendingRetryMessage = text;
        openLocationModal();
      }
    } catch (err) {
      typingEl.remove();
      addMessage(`Network error: ${err.message}`, "error");
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
    }
  }

  sendEl.addEventListener("click", () => sendMessage());
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  const storedPhone = localStorage.getItem(PHONE_STORAGE_KEY);
  if (storedPhone) {
    enterChat(storedPhone);
  }
</script>
</body>
</html>
