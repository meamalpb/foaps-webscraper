replicaCount: 1
image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 80

hostName: "souq-ai-staging.orderpipe.co"

commonEnv:
  ENV: "prod"
  CLAUDE_MODEL: "anthropic.claude-opus-4-8"

# Keys pulled from the `{{ fullname }}-secrets` Secret at deploy time (added in the next step).
secretEnv:
  - DATABASE_URL
  - AWS_BEARER_TOKEN_BEDROCK
  - AWS_REGION
  - RUNMODE
  - NUMBER_OF_RETAILERS
  - NUMBER_OF_IMAGES
  - NUMBER_OF_FLYERS

livenessProbe:
  httpGet:
    path: /docs
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /docs
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

# Persists /app/results (scraped flyers/images/products) across restarts and
# deploys. storageClassName "" uses the cluster's default StorageClass
# (eks-ebs-csi-sc, EBS gp3).
persistence:
  size: 1Gi
  storageClassName: ""
