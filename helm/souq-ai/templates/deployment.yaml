apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "souq-ai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "souq-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "souq-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "souq-ai.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: {{ include "souq-ai.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: results
              mountPath: /app/results
          env:
            {{- range $key, $value := .Values.commonEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Namespace }}-secrets
                  key: {{ . }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      restartPolicy: Always
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: {{ include "souq-ai.fullname" . }}-results-pvc
  strategy:
    # EBS volumes are ReadWriteOnce, so with a single replica the old and new
    # pods can't both hold the results PVC at once; RollingUpdate would get
    # stuck waiting to attach it to the surge pod. Recreate tears the old pod
    # down first, trading a few seconds of downtime per deploy for a rollout
    # that doesn't hang.
    type: Recreate
